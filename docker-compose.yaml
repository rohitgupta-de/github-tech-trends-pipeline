services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.8.1-python3.10
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_ADMIN_USERNAME=admin
      - AIRFLOW_ADMIN_PASSWORD=admin
      - AIRFLOW_ADMIN_FIRSTNAME=Data
      - AIRFLOW_ADMIN_LASTNAME=Engineer
      - AIRFLOW_ADMIN_EMAIL=admin@example.com
      - _PIP_ADDITIONAL_REQUIREMENTS=dbt-duckdb
      - DB_HOST=postgres
      - DB_USER=airflow
      - DB_PASSWORD=airflow
      - DB_NAME=airflow
      - DB_SCHEMA=public
      - DBT_PROJECT_DIR=/opt/airflow/dbt_project
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./dbt_project:/opt/airflow/dbt_project
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Data --lastname Engineer --role Admin --email admin@example.com

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=dbt-duckdb
      - DB_HOST=postgres
      - DB_USER=airflow
      - DB_PASSWORD=airflow
      - DB_NAME=airflow
      - DB_SCHEMA=public
      - DBT_PROJECT_DIR=/opt/airflow/dbt_project
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./dbt_project:/opt/airflow/dbt_project
    ports:
      - "8080:8080"
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint"]
    command: ["webserver"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=dbt-duckdb
      - DB_HOST=postgres
      - DB_USER=airflow
      - DB_PASSWORD=airflow
      - DB_NAME=airflow
      - DB_SCHEMA=public
      - DBT_PROJECT_DIR=/opt/airflow/dbt_project
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./dbt_project:/opt/airflow/dbt_project
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint"]
    command: ["scheduler"]